name: Local application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aster_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/aster_test
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/aster_test
      APP_URL: http://localhost:5173
      API_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ci-test-only-not-a-production-credential
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
